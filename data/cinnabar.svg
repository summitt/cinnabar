<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d3d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff2d55" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a74"/>
      <stop offset="1" stop-color="#ff4a4a"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="sq"><rect x="0" y="0" width="512" height="512" rx="118"/></clipPath>
  </defs>

  <!-- squircle plate -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="256" cy="276" rx="200" ry="190" fill="url(#glow)" filter="url(#blur)"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- crystal: elongated hexagon, crown facets around a table -->
  <g transform="rotate(-18 256 256) translate(256 256)">
    <!-- shadow under the stone -->
    <path d="M0 -168 L104 -82 L104 84 L0 170 L-104 84 L-104 -82 Z" fill="#000" opacity="0.35" filter="url(#soft)" transform="translate(10 14)"/>
    <!-- outer facets -->
    <path d="M0 -168 L104 -82 L52 -41 L0 -84 Z" fill="#ff7a62"/>        <!-- top-right -->
    <path d="M104 -82 L104 84 L52 42 L52 -41 Z" fill="#e8323f"/>        <!-- right -->
    <path d="M104 84 L0 170 L0 84 L52 42 Z" fill="#a61a44"/>            <!-- bottom-right -->
    <path d="M0 170 L-104 84 L-52 42 L0 84 Z" fill="#c2203f"/>          <!-- bottom-left -->
    <path d="M-104 84 L-104 -82 L-52 -41 L-52 42 Z" fill="#ee4a46"/>    <!-- left -->
    <path d="M-104 -82 L0 -168 L0 -84 L-52 -41 Z" fill="#ffa08c"/>      <!-- top-left -->
    <!-- table -->
    <path d="M0 -84 L52 -41 L52 42 L0 84 L-52 42 L-52 -41 Z" fill="url(#table)"/>
    <!-- facet edges -->
    <path d="M0 -168 L104 -82 L104 84 L0 170 L-104 84 L-104 -82 Z M0 -84 L52 -41 L52 42 L0 84 L-52 42 L-52 -41 Z M0 -168 L0 -84 M104 -82 L52 -41 M104 84 L52 42 M0 170 L0 84 M-104 84 L-52 42 M-104 -82 L-52 -41"
          fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
    <!-- specular sweep across the top -->
    <path d="M-104 -82 L0 -168 L104 -82 L52 -41 L-52 -41 Z" fill="url(#spec)"/>
    <!-- three tiny lights on the table: the traffic lights -->
    <circle cx="-24" cy="-10" r="8" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="0" cy="-10" r="8" fill="#ffffff" fill-opacity="0.75"/>
    <circle cx="24" cy="-10" r="8" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>
